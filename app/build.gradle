plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.reprodutorcdvd'
    compileSdk 37

    defaultConfig {
        applicationId 'br.com.reprodutorcdvd'
        minSdk 26
        targetSdk 37
        versionCode 1
        versionName '0.1.0'
    }

    packaging {
        resources.excludes += ['/META-INF/DEPENDENCIES', '/META-INF/LICENSE*', '/META-INF/NOTICE*']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':discmount-backend')
}
